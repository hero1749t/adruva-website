version: '3.8'

services:
  # 1. PostgreSQL Database (Replaces Railway/Neon for <1ms network latency)
  db:
    image: postgres:15-alpine
    container_name: adruva-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-adruva_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-adruvasolution}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-adruvasolution}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache (For fast session storage, API rate-limiting & analytics queues)
  redis:
    image: redis:7-alpine
    container_name: adruva-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. NestJS Backend API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: adruva-api
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-adruva_secure_pass_2026}@db:5432/${DB_NAME:-adruvasolution}?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - .env:/app/.env

  # 4. Next.js Frontend Web App
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: adruva-web
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    volumes:
      - .env:/app/.env

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
